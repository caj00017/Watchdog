name: Release candidate and publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  gate:
    name: Trusted release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - name: Install hash-locked gate environment
        run: python -m pip install --require-hashes -r requirements/dev.lock
      - name: Install Watchdog without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify exact tag and release inputs
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/verify_release.py --expected-version 0.1.0 --tag "${GITHUB_REF_NAME}"
      - name: Verify candidate-only dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/verify_release.py --expected-version 0.1.0
      - name: Run deterministic release gates
        run: |
          ruff format --check .
          ruff check .
          mypy
          python -m compileall -q apps watchdog tests scripts
          pytest
          docker compose config --quiet

  build:
    name: Build immutable package artifacts
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/release.lock
      - name: Install hash-locked release environment
        run: python -m pip install --require-hashes -r requirements/release.lock
      - name: Build once from the exact commit
        run: |
          SOURCE_DATE_EPOCH=1785628800 \
            python -m build --no-isolation
          python scripts/normalize_sdist.py \
            --epoch 1785628800 \
            dist/nexura_watchdog-0.1.0.tar.gz
      - name: Validate artifact metadata and contents
        run: |
          python -m twine check --strict dist/*
          python scripts/verify_release.py --expected-version 0.1.0 --dist-dir dist
      - name: Record SHA-256 checksums
        run: sha256sum dist/* > SHA256SUMS
      - name: Retain package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexura-watchdog-0.1.0-packages
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Retain checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexura-watchdog-0.1.0-checksums
          path: SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish approved stable tag to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/nexura-watchdog
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the already validated artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nexura-watchdog-0.1.0-packages
          path: dist
      - name: Publish without rebuilding
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist/
          print-hash: true
