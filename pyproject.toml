[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexura-watchdog"
version = "0.1.0"
description = "Evidence-driven vulnerability advisory intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "packaging>=24.2,<26",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.9,<3",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["apps*", "watchdog*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
files = ["apps", "watchdog", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true
