[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nexura-watchdog"
version = "0.1.0"
description = "Evidence-driven vulnerability advisory intelligence"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Christopher Jones" },
]
maintainers = [
    { name = "Christopher Jones" },
]
keywords = ["security", "vulnerability", "osv", "dependency-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "packaging>=24.2,<26",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "textual>=8.2.8,<9",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
watchdog = "watchdog.launcher:main"

[project.optional-dependencies]
dev = [
    "httpx2>=2.9,<3",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.9,<1",
]
release = [
    "build>=1.3,<2",
    "twine>=6.2,<7",
]

[project.urls]
Homepage = "https://github.com/caj00017/Watchdog"
Documentation = "https://github.com/caj00017/Watchdog/tree/main/docs"
Issues = "https://github.com/caj00017/Watchdog/issues"
Repository = "https://github.com/caj00017/Watchdog.git"

[tool.setuptools.packages.find]
include = ["apps*", "watchdog*"]

[tool.setuptools.package-data]
"apps.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs/archive"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
files = ["apps", "watchdog", "tests", "scripts"]

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true
